<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Floating sidebar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./meridian.css">
<script src="./meridian-kit.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
body{margin:0}
.sbx .nav{cursor:pointer;transition:background var(--d2) var(--ease),color var(--d2) var(--ease)}
.sb-ring-pulse{animation:sb-ring 1.1s ease-in-out infinite;border-radius:50%}
@keyframes sb-ring{0%,100%{box-shadow:0 0 0 0 rgba(106,183,255,0)}50%{box-shadow:0 0 0 7px rgba(106,183,255,.22),0 0 18px rgba(139,243,216,.55)}}
.sbx .rail-nav{width:48px;padding:0;justify-content:center}
.sbx .live{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border-radius:14px;margin:0 0 8px;background:linear-gradient(135deg,rgba(106,183,255,.22),rgba(139,243,216,.10));box-shadow:0 0 0 1px rgba(106,183,255,.34),0 0 24px rgba(106,183,255,.16)}
</style>
</helmet>
<div class="glass sbx" style="{{boxStyle}}">
<div style="{{innerStyle}}">
<sc-if value="{{hasFlight}}" hint-placeholder-val="{{ true }}">
<sc-if value="{{full}}" hint-placeholder-val="{{ true }}">
<div class="live" aria-label="In flight, {{flight}} remaining"><span class="pulse" style="color:var(--accent-1);display:inline-flex"><span class="dotp"></span></span><div style="flex:1;min-width:0"><div class="eyebrow" style="font-size:10px;line-height:12px">In flight</div><div class="mono" style="font-size:15px;font-weight:600;line-height:18px">{{flight}}</div></div><svg class="ic ic14 c2"><use href="./icons.svg#chev-r"></use></svg></div>
</sc-if>
<sc-if value="{{isRail}}" hint-placeholder-val="{{ false }}"><div class="live rail-nav" style="width:48px;padding:0;justify-content:center"><span class="pulse" style="color:var(--accent-1);display:inline-flex"><span class="dotp"></span></span></div></sc-if>
</sc-if>
<sc-for list="{{items}}" as="it" hint-placeholder-count="9">
<sc-if value="{{it.isLabel}}" hint-placeholder-val="{{ false }}"><div class="eyebrow sb-label" style="{{it.ls}}">{{it.t}}</div></sc-if>
<sc-if value="{{it.isItem}}" hint-placeholder-val="{{ true }}">
<div class="{{it.cls}}" style="{{it.ns}}" title="{{it.t}}"><svg class="ic ic18"><use href="{{it.ic}}"></use></svg><sc-if value="{{full}}" hint-placeholder-val="{{ true }}"><span>{{it.t}}</span></sc-if><sc-if value="{{it.hasKbd}}" hint-placeholder-val="{{ false }}"><span class="kbd">{{it.k}}</span></sc-if><sc-if value="{{it.hasBadge}}" hint-placeholder-val="{{ false }}"><span class="badge" style="{{it.bs}}">{{it.b}}</span></sc-if></div>
</sc-if>
</sc-for>
<div style="flex:1"></div>
<div style="{{footStyle}}">
<div class="{{ringCls}}" style="position:relative;width:34px;height:34px;flex:none"><svg width="34" height="34" viewBox="0 0 34 34" style="position:absolute;left:0;top:0;transform:rotate(-90deg)"><circle cx="17" cy="17" r="15" fill="none" stroke="var(--fill-3)" stroke-width="2.5"/><circle cx="17" cy="17" r="15" fill="none" stroke="url(#sbg)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="{{ringDash}}"/><defs><linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6AB7FF"/><stop offset="1" stop-color="#8BF3D8"/></linearGradient></defs></svg><span class="av sm" style="position:absolute;left:6px;top:6px;--avc:var(--sc-create)">E</span></div>
<sc-if value="{{full}}" hint-placeholder-val="{{ true }}"><div style="flex:1;min-width:0"><div style="font:600 13px/16px var(--font-ui)">{{name}}</div><div class="mono c2" style="font-size:11px;line-height:14px">{{km}} km</div></div></sc-if>
<sc-if value="{{full}}" hint-placeholder-val="{{ true }}"><span class="btn-round glass-ctl sm" style="position:relative" title="Settings ⌘,"><svg class="ic ic18 c2"><use href="./icons.svg#settings"></use></svg></span></sc-if>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["plan","tickets","cards","passport","map","stats","together"],"default":"plan"},"rail":{"editor":"boolean","default":false},"flight":{"editor":"text","default":""},"$preview":{"width":236,"height":784}}'>
class Component extends DCLogic {
  renderVals() {
    const K = window.MeridianKit, p = this.props, me = K.me;
    const rail = p.rail === true || p.rail === 'true';
    const act = p.active || 'plan', flight = p.flight || '';
    const hov = p.hover || '', badge = p.badge || '';
    const mk = (id, t, ic, k, sub) => ({ isItem: true, isLabel: false, t, ic: './icons.svg#' + ic, k, hasKbd: !rail && !!k, hasBadge: badge === id, b: '+1', bs: rail ? 'position:absolute;right:2px;top:2px;min-width:16px;height:16px;font-size:10px;padding:0 4px' : 'margin-left:6px',
      cls: 'nav' + (sub ? ' sub' : '') + (act === id ? ' is-active' : '') + (hov === id ? ' is-hover' : '') + (rail ? ' rail-nav' : ''), ns: rail ? 'position:relative' : '' });
    const lb = t => ({ isLabel: true, isItem: false, t, ls: rail ? 'display:none' : '' });
    const items = [lb('Fly'), mk('plan', 'Plan', 'plane', '⌘1'), lb('Wallet'), mk('tickets', 'Tickets', 'ticket', '⌘2'), mk('cards', 'Cards', 'card', '', true), mk('passport', 'Passport', 'passport', '', true), lb('Explore'), mk('map', 'Map', 'globe', '⌘3'), mk('stats', 'Stats', 'chart', '⌘4'), mk('together', 'Together', 'users', '⌘5')];
    if (rail) { items.forEach(i => { if (i.cls) i.cls = i.cls.replace(' sub', ''); }); }
    const kmv = p.km ? +p.km : me.km, circ = 2 * Math.PI * 15, frac = Math.min(1, kmv / 20000);
    return {
      items, full: !rail, isRail: rail, hasFlight: !!flight, flight, name: me.name, km: K.fmtKm(kmv), ringCls: (p.ringPulse === true || p.ringPulse === 'true') ? 'sb-ring-pulse' : '', ringDash: (frac * circ).toFixed(1) + ' ' + circ.toFixed(1),
      boxStyle: 'position:absolute;left:8px;top:8px;bottom:8px;width:' + (rail ? 64 : 220) + 'px;border-radius:var(--r-sidebar);z-index:40;overflow:hidden',
      innerStyle: 'position:absolute;inset:0;padding:' + (rail ? '52px 7px 10px' : '52px 10px 10px') + ';display:flex;flex-direction:column;gap:2px' + (rail ? ';align-items:center' : ''),
      footStyle: 'display:flex;align-items:center;gap:10px;padding:10px 6px 2px;border-top:1px solid var(--stroke-hair);margin-top:6px;width:100%' + (rail ? ';justify-content:center;padding:10px 0 2px' : '')
    };
  }
}
</script>
</body>
</html>
