<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>World map (flat)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./meridian.css">
<script src="./meridian-kit.js"></script>
<script src="./meridian-world.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>body{margin:0}
.wf-lbl{position:absolute;font:700 11px/1 var(--font-cond);letter-spacing:.08em;color:var(--text-1);text-shadow:0 0 3px var(--bg-0),0 0 3px var(--bg-0),0 1px 6px var(--bg-0);pointer-events:none;white-space:nowrap}
</style>
</helmet>
<div class="world" style="{{rootStyle}}">
<div style="{{innerStyle}}">
<sc-if value="{{dots}}" hint-placeholder-val="{{ false }}"><div style="{{dotStyle}}"></div></sc-if>
<sc-if value="{{notDots}}" hint-placeholder-val="{{ true }}"><div class="w-land" style="{{layerStyle}}"></div><div class="w-border" style="{{layerStyle}}"></div></sc-if>
<sc-if value="{{visited}}" hint-placeholder-val="{{ true }}"><div class="w-lo" style="{{layerStyle}}"></div><div class="w-mid" style="{{layerStyle}}"></div><div class="w-hi" style="{{layerStyle}}"></div></sc-if>
</div>
<svg width="{{W}}" height="{{H}}" viewBox="0 0 {{W}} {{H}}" style="position:absolute;left:0;top:0;overflow:visible;pointer-events:none">
<sc-if value="{{grat}}" hint-placeholder-val="{{ true }}"><path d="{{gratD}}" fill="none" style="stroke:var(--m-grat)" stroke-width="1"/></sc-if>
<sc-for list="{{routes}}" as="r" hint-placeholder-count="6">
<path d="{{r.d}}" fill="none" stroke="{{r.c}}" stroke-width="{{r.gw}}" opacity="{{r.go}}" stroke-linecap="round" style="filter:blur(3px)"/>
<path d="{{r.d}}" fill="none" stroke="{{r.c}}" stroke-width="{{r.w}}" opacity="{{r.o}}" stroke-linecap="round"/>
</sc-for>
<sc-for list="{{pins}}" as="p" hint-placeholder-count="6">
<circle cx="{{p.x}}" cy="{{p.y}}" r="{{p.r}}" fill="{{p.c}}" style="stroke:var(--bg-0)" stroke-width="1.5"/>
</sc-for>
</svg>
<sc-for list="{{lbls}}" as="l" hint-placeholder-count="6"><span class="wf-lbl" style="{{l.s}}">{{l.code}}</span></sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"w":{"editor":"int","default":1000},"latTop":{"editor":"float","default":80},"latBot":{"editor":"float","default":-56},"visited":{"editor":"boolean","default":true},"dots":{"editor":"boolean","default":false},"grat":{"editor":"boolean","default":true},"labels":{"editor":"boolean","default":true},"$preview":{"width":1000,"height":378}}'>
class Component extends DCLogic {
  flag(v, d) { return v === undefined || v === null || v === '' ? d : !(v === false || v === 'false'); }
  renderVals() {
    const p = this.props, Wd = window.MeridianWorld, K = window.MeridianKit;
    const W = +(p.w || 1000), top = p.latTop === undefined ? 80 : +p.latTop, bot = p.latBot === undefined ? -56 : +p.latBot, s = W / 360, H = Math.round((top - bot) * s);
    const dots = this.flag(p.dots, false), visited = this.flag(p.visited, true), grat = this.flag(p.grat, true), labels = this.flag(p.labels, true);
    const off = (90 - top) * s;
    let gratD = ''; if (grat) { for (let lon = -180; lon <= 180; lon += 30) gratD += 'M' + ((lon + 180) * s).toFixed(1) + ',0L' + ((lon + 180) * s).toFixed(1) + ',' + H; for (let lat = Math.ceil(bot / 30) * 30; lat <= top; lat += 30) { const y = ((top - lat) * s).toFixed(1); gratD += 'M0,' + y + 'L' + W + ',' + y; } }
    const rs = Array.isArray(p.routes) ? p.routes : [];
    const routes = rs.map(r => { const A = K.ap(r.a), B = K.ap(r.b); if (!A || !B) return null; const km = K.gc(r.a, r.b), h = Math.min(60, km / 100 * s * .6 * (r.h === undefined ? 1 : r.h)); return { d: Wd.flatArc([A.lat, A.lon], [B.lat, B.lon], W, top, 40, h), c: r.c || '#6AB7FF', w: r.w || 1.5, o: r.o === undefined ? .7 : r.o, gw: (r.w || 1.5) * 4, go: (r.o === undefined ? .7 : r.o) * .3 }; }).filter(Boolean);
    const pins = (Array.isArray(p.pins) ? p.pins : []).map(q => { const A = K.ap(q.code); if (!A) return null; const xy = Wd.flat(A.lat, A.lon, W, top); return { x: xy[0].toFixed(1), y: xy[1].toFixed(1), r: q.r || 3.2, c: q.c || '#FFB547', lbl: labels && q.label !== false, code: q.code, tx: (xy[0] + 6).toFixed(1), ty: (xy[1] - 5).toFixed(1) }; }).filter(Boolean);
    const lbls = pins.filter(q => q.lbl).map(q => ({ code: q.code, s: 'left:' + (parseFloat(q.x) + 6) + 'px;top:' + (parseFloat(q.y) - 14) + 'px' }));
    return {
      lbls, W, H, visited, dots, notDots: !dots, grat, gratD, routes, pins,
      rootStyle: 'position:relative;width:' + W + 'px;height:' + H + 'px;overflow:hidden',
      innerStyle: 'position:absolute;left:0;top:' + (-off).toFixed(1) + 'px;width:' + W + 'px;height:' + (W / 2) + 'px',
      layerStyle: 'position:absolute;inset:0',
      dotStyle: 'position:absolute;inset:0;color:var(--text-3);background:radial-gradient(circle,currentColor 38%,transparent 44%) 0 0/' + Math.max(4, W / 220).toFixed(1) + 'px ' + Math.max(4, W / 220).toFixed(1) + 'px;-webkit-mask:url(./world-land.svg) 0 0/100% 100% no-repeat;mask:url(./world-land.svg) 0 0/100% 100% no-repeat;opacity:.9'
    };
  }
}
</script>
</body>
</html>
