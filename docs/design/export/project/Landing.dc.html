<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Landing and arrival</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./meridian.css">
<script src="./meridian-kit.js"></script>
<script src="./meridian-audio.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
body{margin:0}
.ld-tile{border-radius:20px;padding:16px 18px;height:96px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}
.ld-num{font:500 40px/40px var(--font-serif);letter-spacing:-.01em}
.ld-num small{font:500 14px/1 var(--font-ui);color:var(--text-2);margin-left:6px;letter-spacing:0}
.ld-notes{position:relative;border-radius:20px;background:var(--paper);color:var(--ink);padding:18px 22px 16px;box-shadow:0 18px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.7)}
.ld-notes textarea{display:block;width:100%;height:96px;resize:none;border:0;outline:0;background:transparent;font:italic 400 22px/30px var(--font-serif);color:var(--ink);padding:0}
.ld-notes textarea::placeholder{color:rgba(20,17,15,.38)}
.ld-notes:focus-within{box-shadow:0 18px 40px rgba(0,0,0,.4),0 0 0 2px var(--accent-1)}
.ld-notes .cap{font:700 10px/12px var(--font-ui);letter-spacing:.18em;text-transform:uppercase;color:rgba(20,17,15,.64)}
</style>
</helmet>
<div class="win" style="background:#06080D">
<div style="position:absolute;inset:0;filter:blur(12px) brightness(1.0) saturate(.9);transform:scale(1.06)"><dc-import name="MapLayer" w="1280" h="800" map-style="terra" zoom="1.5" lat="48.9" lon="2.4" labels="false" hint-size="1280px,800px"></dc-import></div>
<div style="position:absolute;inset:0;background:rgba(5,7,13,.40)"></div>
<dc-import name="Sidebar" active="plan" badge="{{badge}}" km="{{sbKm}}" ring-pulse="{{ringPulse}}" hint-size="220px,784px"></dc-import>
<div class="tl"><i></i><i></i><i></i></div>

<div style="position:absolute;left:272px;top:58px">
<div class="eyebrow">Charles de Gaulle · Touchdown {{landTime}}</div>
<div class="serif" style="font-size:52px;line-height:58px;font-weight:500;letter-spacing:-.015em;margin-top:6px">Landed in {{toCity}}.</div>
</div>

<!-- ticket -->
<div style="{{ticketStyle}}"><dc-import name="Ticket" from="{{from}}" to="{{to}}" state="landed" scale=".86" anim="{{anim}}" topic="Auth module refactor" land-time="{{landTime}}" hint-size="310px,389px"></dc-import></div>

<!-- right column -->
<div style="{{colStyle}}">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
<div class="glass e2 ld-tile"><div class="eyebrow">Time focused</div><div class="ld-num">{{dur}}<small>min</small></div></div>
<div class="glass e2 ld-tile"><div class="eyebrow">Distance</div><div class="ld-num">{{km}}<small>km</small></div></div>
<div class="glass e2 ld-tile"><div class="eyebrow">Miles earned</div><div class="ld-num">+{{km}}<small>km</small></div></div>
<div class="glass e2 ld-tile"><div class="eyebrow">Streak</div><div class="ld-num" style="display:flex;align-items:center;gap:10px">6<small style="margin-left:0">days</small><svg width="26" height="22" viewBox="0 0 26 22" fill="none" stroke="var(--accent-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto"><path d="M3 18L13 4L23 18"/><path d="M8 18L13 11L18 18"/></svg></div></div>
</div>
<div class="ld-notes" style="margin-top:16px">
<div class="cap">Notes</div>
<textarea placeholder="What did you get done?" aria-label="What did you get done?" onInput="{{onNotes}}" value="{{notesVal}}"></textarea>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px"><span class="mono" style="font-size:11px;color:rgba(20,17,15,.64)">Saved on the back of your ticket</span><span class="mono" style="font-size:11px;color:rgba(20,17,15,.64)">{{noteLen}} / 140</span></div>
</div>
<div style="display:flex;gap:12px;margin-top:18px;align-items:center">
<button class="btn btn-primary btn-lg {{btnWalletCls}}" onClick="{{addWallet}}"><svg class="ic ic18"><use href="./icons.svg#wallet"></use></svg>Add to wallet</button>
<button class="btn btn-secondary btn-lg" onClick="{{flyAgain}}"><svg class="ic ic18"><use href="./icons.svg#plane"></use></svg>Fly again from {{to}}</button>
<span class="btn-round glass glass-ctl" style="position:relative" role="button" aria-label="Share card" title="Share card"><svg class="ic ic18"><use href="./icons.svg#share"></use></svg></span>
</div>
</div>
<sc-if value="{{toast}}" hint-placeholder-val="{{ false }}"><div class="glass e3 toast" style="position:absolute;left:{{toastLeft}}px;bottom:30px;transform:translateX(-50%)"><span style="width:34px;height:34px;border-radius:50%;background:rgba(91,227,160,.16);color:var(--ok);display:flex;align-items:center;justify-content:center;flex:none"><svg class="ic ic18"><use href="./icons.svg#check"></use></svg></span><div><div style="font:600 14px/18px var(--font-ui)">Added to your wallet</div><div class="t-callout c2">+{{km}} km. You're {{toGold}} km from Meridian Gold.</div></div></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"from":{"editor":"text","default":"LHR"},"to":{"editor":"text","default":"CDG"},"live":{"editor":"boolean","default":false},"anim":{"editor":"boolean","default":false},"fly":{"editor":"float","default":0},"notes":{"editor":"text","default":""},"onFlyAgain":{"editor":null},"onWallet":{"editor":null},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  state = { notes: null, fly: 0, added: false };
  flag(v, d) { return v === undefined || v === null || v === '' ? d : !(v === false || v === 'false'); }
  componentWillUnmount() { cancelAnimationFrame(this._raf); }
  addWallet() {
    if (this.state.added) return; const A = window.MeridianAudio; this.setState({ added: true }); const t0 = performance.now();
    const L = now => { const u = Math.min(1, (now - t0) / 900); this.setState({ fly: u }); if (u >= 1) { if (A && A.enabled) A.thump(); const cb = this.props.onWallet; if (typeof cb === 'function') setTimeout(cb, 900); return; } this._raf = requestAnimationFrame(L); }; this._raf = requestAnimationFrame(L);
  }
  renderVals() {
    const p = this.props, K = window.MeridianKit, st = this.state, live = this.flag(p.live, false);
    const from = p.from || 'LHR', to = p.to || 'CDG', B = K.ap(to), km = p.km ? +p.km : Math.round(K.gc(from, to)), dur = p.minutes || K.minutes(km);
    const notes = st.notes !== null ? st.notes : (typeof p.notes === 'string' ? p.notes : '');
    const u = live ? st.fly : +(p.fly || 0), e = u * u * (3 - 2 * u);
    const tx0 = 272, ty0 = 150, tx1 = 38 - 155, ty1 = 240 - 195;
    const sbKm = 12022 + Math.round(km * e);
    return {
      from, to, toCity: B.city, km, dur, landTime: p.landTime || '10:42', anim: this.flag(p.anim, false), notesVal: notes, noteLen: notes.length,
      ticketStyle: 'position:absolute;left:' + (tx0 + (tx1 - tx0) * e) + 'px;top:' + (ty0 + (ty1 - ty0) * e) + 'px;width:310px;height:389px;transform:scale(' + (1 - .9 * e).toFixed(3) + ') rotate(' + (-6 * e).toFixed(1) + 'deg);transform-origin:50% 50%;opacity:' + (u > .9 ? Math.max(0, 1 - (u - .9) * 10) : 1).toFixed(2) + ';z-index:12',
      colStyle: 'position:absolute;left:690px;top:150px;width:540px;opacity:' + (1 - .0 * e),
      badge: u > .96 || (!live && +(p.fly || 0) >= 1) ? 'tickets' : '', sbKm, ringPulse: u > .9,
      toast: st.added && u >= 1, toastLeft: 748, toGold: K.fmtKm(20000 - sbKm), btnWalletCls: st.added ? 'is-disabled' : '',
      onNotes: e2 => this.setState({ notes: e2.target.value.slice(0, 140) }), addWallet: () => this.addWallet(),
      flyAgain: () => { const cb = this.props.onFlyAgain; if (typeof cb === 'function') cb({ from: to }); }
    };
  }
}
</script>
</body>
</html>
