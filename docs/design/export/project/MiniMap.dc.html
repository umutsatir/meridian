<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mini floating map</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./meridian.css">
<script src="./meridian-kit.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
body{margin:0}
.mm-ctl{position:absolute;display:flex;gap:6px;transition:opacity 180ms var(--ease),transform 180ms var(--ease)}
.mm-b{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--text-1);background:rgba(18,26,46,.62);backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);cursor:pointer;transition:background var(--d1) var(--ease),transform var(--d1) var(--ease)}
.mm-b:hover,.mm-b.is-hover{background:rgba(40,56,92,.8)}
.mm-b:active,.mm-b.is-pressed{transform:scale(.92)}
.mm-b:focus-visible,.mm-b.is-focus{outline:2px solid var(--accent-1);outline-offset:2px}
.mm-chip{position:absolute;left:12px;bottom:12px;height:30px;padding:0 12px;border-radius:15px;display:flex;align-items:center;gap:8px;background:rgba(18,26,46,.66);backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);font:500 14px/1 var(--font-mono);letter-spacing:-.02em;color:#F3F5FA}
.mm-grip{position:absolute;right:4px;bottom:4px;width:22px;height:22px;cursor:nwse-resize;display:flex;align-items:flex-end;justify-content:flex-end;padding:5px;box-sizing:border-box;color:rgba(255,255,255,.7);transition:opacity 180ms var(--ease)}
</style>
</helmet>
<div style="{{boxStyle}}" onPointerEnter="{{enter}}" onPointerLeave="{{leave}}">
<dc-import name="MapLayer" w="{{W}}" h="{{H}}" map-style="terra" zoom="{{zoom}}" lat="{{cLat}}" lon="{{cLon}}" labels="{{labels}}" smooth="true" hint-size="{{W}}px,{{H}}px"></dc-import>
<div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,8,13,0) 50%,rgba(6,8,13,.5) 100%)"></div>
<svg width="{{W}}" height="{{H}}" style="position:absolute;left:0;top:0;overflow:visible"><defs><linearGradient id="{{gid}}" gradientUnits="userSpaceOnUse" x1="{{x1}}" y1="{{y1}}" x2="{{x2}}" y2="{{y2}}"><stop offset="0" stop-color="#6AB7FF"/><stop offset="1" stop-color="#8BF3D8"/></linearGradient></defs>
<path d="{{futureD}}" fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="1.4" stroke-dasharray="2 5" stroke-linecap="round"/>
<path d="{{trailD}}" fill="none" stroke="#6AB7FF" stroke-opacity=".3" stroke-width="6" stroke-linecap="round"/>
<path d="{{trailD}}" fill="none" stroke="url(#{{gid}})" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="{{ax}}" cy="{{ay}}" r="3.2" fill="#fff"/><circle cx="{{bx}}" cy="{{by}}" r="3.2" fill="none" stroke="#FFB547" stroke-width="1.6"/></svg>
<div style="{{planeStyle}}"><dc-import name="Plane" size="24" heading="{{heading}}" color="#FFFFFF" hint-size="24px,24px"></dc-import></div>
<div class="mm-chip"><span>{{time}}</span><span style="font:500 11px/1 var(--font-ui);color:rgba(243,245,250,.82);letter-spacing:0">{{sub}}</span></div>
<sc-if value="{{ct}}" hint-placeholder-val="{{ false }}"><span class="pill accent" style="position:absolute;left:12px;top:12px;background:rgba(18,26,46,.7);backdrop-filter:blur(10px)"><svg class="ic ic12"><use href="./icons.svg#target"></use></svg>Click-through</span></sc-if>
<div class="mm-ctl" style="right:10px;top:10px;opacity:{{ctlOp}};transform:translateY({{ctlY}}px)"><span class="mm-b {{c.pause}}" role="button" aria-label="Pause" onClick="{{onPause}}"><svg class="ic ic14"><use href="{{pauseIc}}"></use></svg></span><span class="mm-b {{c.sound}}" role="button" aria-label="Sound" onClick="{{onSound}}"><svg class="ic ic14"><use href="./icons.svg#sound"></use></svg></span><span class="mm-b {{c.size}}" role="button" aria-label="Size" onClick="{{onSize}}"><svg class="ic ic14"><use href="./icons.svg#resize"></use></svg></span><span class="mm-b {{c.close}}" role="button" aria-label="Close" onClick="{{onClose}}"><svg class="ic ic14"><use href="./icons.svg#x"></use></svg></span></div>
<div class="mm-grip" style="opacity:{{ctlOp}}" onPointerDown="{{gDown}}" onPointerMove="{{gMove}}" onPointerUp="{{gUp}}"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M9 3L3 9M9 6.5L6.5 9"/></svg></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"enum","options":["s","m","l"],"default":"m"},"hover":{"editor":"boolean","default":false},"live":{"editor":"boolean","default":false},"p":{"editor":"float","default":.55},"opacity":{"editor":"float","default":1},"clickThrough":{"editor":"boolean","default":false},"paused":{"editor":"boolean","default":false},"chip":{"editor":"text","default":""},"hoverBtn":{"editor":"text","default":""},"onSize":{"editor":null},"onClose":{"editor":null},"onResize":{"editor":null},"$preview":{"width":480,"height":270}}'>
class Component extends DCLogic {
  state = { over: false };
  flag(v, d) { return v === undefined || v === null || v === '' ? d : !(v === false || v === 'false'); }
  renderVals() {
    const p = this.props, K = window.MeridianKit, EU = K.eu, live = this.flag(p.live, false), st = this.state;
    const dims = { s: [360, 200], m: [480, 270], l: [640, 360] }, d = dims[p.size] || dims.m, W = p.w ? +p.w : d[0], H = p.h ? +p.h : d[1];
    const prog = Math.max(0, Math.min(1, +(p.p === undefined ? .55 : p.p)));
    const pts = K.arc('LHR', 'CDG', 60), si = prog * (pts.length - 1), k0 = Math.floor(si), k1 = Math.min(pts.length - 1, k0 + 1), f = si - k0;
    const here = [pts[k0][0] + (pts[k1][0] - pts[k0][0]) * f, pts[k0][1] + (pts[k1][1] - pts[k0][1]) * f];
    const A = EU.xy(pts[0][0], pts[0][1]), B = EU.xy(pts[pts.length - 1][0], pts[pts.length - 1][1]);
    const z = Math.min(.62 * W / Math.max(Math.abs(A[0] - B[0]), 1), .5 * H / Math.max(Math.abs(A[1] - B[1]), 1), 4);
    const mid = pts[Math.floor(pts.length / 2)], C = EU.xy(mid[0], mid[1]);
    const scr = (lat, lon) => { const q = EU.xy(lat, lon); return [(q[0] - C[0]) * z + W / 2, (q[1] - C[1]) * z + H / 2]; };
    const sp = pts.map(q => scr(q[0], q[1])), hp = scr(here[0], here[1]), hp2 = scr(pts[k1][0], pts[k1][1]), path = a => a.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');
    const heading = Math.atan2(sp[Math.min(sp.length - 1, k0 + 2)][0] - sp[k0][0], -(sp[Math.min(sp.length - 1, k0 + 2)][1] - sp[k0][1])) * 180 / Math.PI;
    const over = live ? st.over : this.flag(p.hover, false), op = +(p.opacity === undefined ? 1 : p.opacity);
    const rem = Math.round((1 - prog) * 42 * 60), paused = this.flag(p.paused, false), hb = p.hoverBtn || '';
    const cc = { pause: hb === 'pause' ? 'is-hover' : '', sound: hb === 'sound' ? 'is-hover' : '', size: hb === 'size' ? 'is-hover' : '', close: hb === 'close' ? 'is-hover' : '' };
    return {
      W, H, boxStyle: 'position:relative;width:' + W + 'px;height:' + H + 'px;border-radius:20px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.22),inset 0 1px 0 rgba(255,255,255,.3),0 24px 56px rgba(0,0,0,.55);opacity:' + op + ';background:#0A1020',
      zoom: z, cLat: mid[0], cLon: mid[1], labels: W >= 480, gid: 'mmg' + W + Math.round(prog * 100), x1: sp[0][0], y1: sp[0][1], x2: sp[sp.length - 1][0], y2: sp[sp.length - 1][1],
      futureD: path(sp.slice(k0)), trailD: path(sp.slice(0, k0 + 1).concat([hp])), ax: sp[0][0].toFixed(1), ay: sp[0][1].toFixed(1), bx: sp[sp.length - 1][0].toFixed(1), by: sp[sp.length - 1][1].toFixed(1),
      planeStyle: 'position:absolute;left:' + (hp[0] - 12).toFixed(1) + 'px;top:' + (hp[1] - 12).toFixed(1) + 'px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))', heading,
      time: p.chip ? p.chip : K.mmss(rem), sub: p.chip ? '' : (paused ? 'Paused' : 'to Paris'), ct: this.flag(p.clickThrough, false), ctlOp: over ? 1 : 0, ctlY: over ? 0 : -4, c: cc, pauseIc: paused ? './icons.svg#play' : './icons.svg#pause',
      enter: () => { if (live) this.setState({ over: true }); }, leave: () => { if (live) this.setState({ over: false }); },
      onPause: () => {}, onSound: () => {}, onSize: () => { const cb = this.props.onSize; if (typeof cb === 'function') cb(); }, onClose: () => { const cb = this.props.onClose; if (typeof cb === 'function') cb(); },
      gDown: e => { if (!live) return; this._g = { x: e.clientX, y: e.clientY, w: W, h: H }; try { e.currentTarget.setPointerCapture(e.pointerId); } catch (z) {} e.stopPropagation(); },
      gMove: e => { if (!this._g) return; const cb = this.props.onResize; if (typeof cb === 'function') cb({ w: this._g.w + (e.clientX - this._g.x), h: this._g.h + (e.clientY - this._g.y), done: false }); },
      gUp: e => { if (!this._g) return; const g = this._g; this._g = null; const cb = this.props.onResize; if (typeof cb === 'function') cb({ w: g.w + (e.clientX - g.x), h: g.h + (e.clientY - g.y), done: true }); }
    };
  }
}
</script>
</body>
</html>
