<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ticket ritual stage</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./meridian.css">
<script src="./meridian-kit.js"></script>
<script src="./meridian-audio.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
body{margin:0}
.rt-slot{position:absolute;border-radius:28px 28px 0 0;background:linear-gradient(180deg,#3A4258 0,#222839 9%,#161B29 38%,#0F131E 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 0 1px rgba(255,255,255,.07),0 -18px 50px rgba(0,0,0,.5);z-index:9}
.rt-slit{position:absolute;height:12px;border-radius:6px;background:linear-gradient(180deg,#010208,#0A0D18);box-shadow:inset 0 3px 7px rgba(0,0,0,.95),0 1px 0 rgba(255,255,255,.16);z-index:9}
.rt-lip{position:absolute;height:10px;border-radius:0 0 9px 9px;background:linear-gradient(180deg,#434B63,#252C3F);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 5px 12px rgba(0,0,0,.5);z-index:11}
.rt-led{position:absolute;width:7px;height:7px;border-radius:50%}
.rt-vent{position:absolute;width:44px;height:3px;border-radius:2px;background:rgba(0,0,0,.55);box-shadow:0 1px 0 rgba(255,255,255,.08)}
.rt-anno{position:absolute;width:268px;padding:12px 14px;border-radius:14px;background:rgba(6,8,13,.72);border:1px dashed rgba(106,183,255,.55);font:500 11px/1.4 var(--font-mono);color:var(--text-2);z-index:30}
.rt-anno b{display:block;font:600 10px/12px var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--accent-1);margin-bottom:4px}
.rt-anno .row{margin-bottom:10px}
.rt-hap{display:flex;gap:3px;margin-top:6px}.rt-hap i{display:block;width:12px;height:12px;border-radius:50%;background:var(--fill-3);transition:background 90ms,box-shadow 90ms}
.rt-hap i.on{background:var(--accent-1);box-shadow:0 0 8px var(--accent-1)}
@keyframes rt-chev{0%,100%{opacity:.35;transform:translateX(0)}50%{opacity:1;transform:translateX(5px)}}
@keyframes rt-perf{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes rt-pop{from{opacity:0;transform:translate(-50%,10px) scale(.97)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
.rt-grab{cursor:grab}.rt-grab:active,.rt-grab.dragging{cursor:grabbing}
.rt-hint .chev{display:inline-block;animation:rt-chev 1.1s ease-in-out infinite}
.rt-btn-skip{opacity:.8}
</style>
</helmet>
<div style="{{outerStyle}}">
<div class="win" style="{{rootStyle}}" tabindex="0" onKeyDown="{{onKey}}" onPointerMove="{{onMove}}" onPointerUp="{{onUp}}" onPointerLeave="{{onUp}}">
<sc-if value="{{bg}}" hint-placeholder-val="{{ true }}">
<div style="position:absolute;inset:0;filter:blur(14px) brightness(1.05) saturate(.9);transform:scale(1.06)"><dc-import name="MapLayer" w="1280" h="800" map-style="terra" zoom="1.1" lat="49.6" lon="2.6" labels="false" hint-size="1280px,800px"></dc-import></div>
<div style="position:absolute;inset:0;background:rgba(5,7,13,.30)"></div>
</sc-if>
<sc-if value="{{sidebar}}" hint-placeholder-val="{{ true }}"><dc-import name="Sidebar" active="plan" badge="{{badge}}" hint-size="220px,784px"></dc-import><div class="tl"><i></i><i></i><i></i></div></sc-if>

<!-- printer slot -->
<div style="{{glowStyle}}"></div>
<div class="rt-slot" style="{{slotStyle}}"><span class="rt-led" style="{{ledStyle}}"></span><i class="rt-vent" style="{{vent1}}"></i><i class="rt-vent" style="{{vent2}}"></i><i class="rt-vent" style="{{vent3}}"></i></div>
<div class="rt-slit" style="{{slitStyle}}"></div>

<!-- ticket -->
<div style="{{stackStyle}}">
<div style="{{bodyWrap}}">
<div style="{{bodyClipWrap}}">
<sc-if value="{{showFull}}" hint-placeholder-val="{{ true }}"><dc-import name="Ticket" from="{{from}}" to="{{to}}" scenario="{{scenario}}" state="{{tState}}" print="{{printV}}" flat="true" topic="{{topic}}" seat="{{seat}}" gate="{{gate}}" flight="{{flight}}" km="{{km}}" minutes="{{minutes}}" hint-size="360px,600px"></dc-import></sc-if>
<sc-if value="{{showTorn}}" hint-placeholder-val="{{ false }}"><dc-import name="Ticket" from="{{from}}" to="{{to}}" scenario="{{scenario}}" state="torn" flat="true" topic="{{topic}}" seat="{{seat}}" gate="{{gate}}" flight="{{flight}}" km="{{km}}" minutes="{{minutes}}" hint-size="360px,452px"></dc-import></sc-if>
</div>
<sc-if value="{{showRim}}" hint-placeholder-val="{{ false }}"><svg width="360" height="600" viewBox="0 0 360 600" style="position:absolute;left:0;top:0;pointer-events:none"><polyline points="{{rimBody}}" fill="none" stroke="#FFFFFF" stroke-opacity=".85" stroke-width="1.1" stroke-linejoin="round"/></svg></sc-if>
</div>
<sc-if value="{{showPiece}}" hint-placeholder-val="{{ false }}">
<div style="{{pieceWrap}}">
<div style="{{pieceClipWrap}}"><dc-import name="Ticket" from="{{from}}" to="{{to}}" scenario="{{scenario}}" state="printed" flat="true" topic="{{topic}}" seat="{{seat}}" gate="{{gate}}" flight="{{flight}}" km="{{km}}" minutes="{{minutes}}" hint-size="360px,600px"></dc-import><div style="{{curlStyle}}"></div></div>
<svg width="360" height="600" viewBox="0 0 360 600" style="position:absolute;left:0;top:0;pointer-events:none"><polyline points="{{rimPiece}}" fill="none" stroke="#FFFFFF" stroke-opacity=".9" stroke-width="1.1" stroke-linejoin="round"/></svg>
</div>
</sc-if>
<sc-if value="{{showVeil}}" hint-placeholder-val="{{ true }}"><div style="{{veilStyle}}"></div></sc-if>
<sc-if value="{{canGrab}}" hint-placeholder-val="{{ false }}"><div class="rt-grab {{dragCls}}" style="{{grabStyle}}" onPointerDown="{{onDown}}" role="button" aria-label="Boarding pass printed. Activate to tear off the stub." tabindex="-1"></div></sc-if>
</div>

<div class="rt-lip" style="{{lipStyle}}"></div>
<!-- tear-here hint along the perforation -->
<sc-if value="{{showHint}}" hint-placeholder-val="{{ true }}">
<div style="{{perfGlow}}"></div>
<div class="glass e2 rt-hint" style="{{hintStyle}}"><span style="font:600 14px/1 var(--font-ui)">Tear here</span><span class="chev"><svg class="ic ic14"><use href="./icons.svg#chev-r"></use></svg></span><span class="chev" style="animation-delay:.15s;margin-left:-8px"><svg class="ic ic14"><use href="./icons.svg#chev-r"></use></svg></span></div>
</sc-if>

<!-- particles -->
<sc-for list="{{parts}}" as="q" hint-placeholder-count="0"><i style="{{q.s}}"></i></sc-for>

<!-- caption + actions -->
<div style="{{capStyle}}">
<sc-if value="{{isPrinting}}" hint-placeholder-val="{{ true }}"><span class="t-callout c2">Printing your boarding pass</span><span class="mono c3" style="font-size:11px">Space to skip</span></sc-if>
<sc-if value="{{isReady}}" hint-placeholder-val="{{ false }}"><button class="btn btn-secondary {{btnCls}}" onClick="{{tearBtn}}"><svg class="ic ic16"><use href="./icons.svg#scissors"></use></svg>Tear <span class="kbd">Space</span></button></sc-if>
</div>
<sc-if value="{{toast}}" hint-placeholder-val="{{ false }}"><div class="glass e3 toast" style="{{toastStyle}}"><span style="width:34px;height:34px;border-radius:50%;background:rgba(91,227,160,.16);color:var(--ok);display:flex;align-items:center;justify-content:center;flex:none"><svg class="ic ic18"><use href="./icons.svg#check"></use></svg></span><div style="font:600 15px/20px var(--font-ui)">Boarding complete. Have a calm flight.</div></div></sc-if>

<!-- annotation -->
<sc-if value="{{annotate}}" hint-placeholder-val="{{ false }}">
<div class="rt-anno" style="{{annoStyle}}">
<div class="row"><b>Sound</b>{{sndText}}</div>
<div class="row"><b>Haptic</b>{{hapText}}<div class="rt-hap"><sc-for list="{{hapDots}}" as="d" hint-placeholder-count="14"><i class="{{d}}"></i></sc-for></div></div>
<div><b>Native</b>NSHapticFeedbackManager .alignment per step; AVAudioEngine buffers synthesized offline.</div>
</div>
</sc-if>
</div>
</div>
</x-dc>
